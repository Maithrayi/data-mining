services:

  minio:
    image:  quay.io/minio/minio:latest
    container_name: annapurna-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: annapurna123
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: annapurna
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  minio_data:
  postgres_data: